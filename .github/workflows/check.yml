name: check
on: [push, pull_request]
jobs:
  no-local-info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The scanner is zsh (it uses zsh arrays and parameter expansion), and
      # GitHub's ubuntu runners do not ship zsh.
      - name: install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: scanner self-test
        run: zsh scripts/check-public.sh --self-test
      - name: scan the tree
        run: zsh scripts/check-public.sh .
