#!/bin/zsh
# Single source of truth for how the `hermes` Apple container is created.
#
# Sourced by BOTH:
#   - start-hermes.sh   (LaunchAgent com.nousresearch.hermes-agent, at login)
#   - hermes-upgrade.sh (LaunchAgent com.nousresearch.hermes-upgrade, scheduled)
#
# Each caller sets HERMES_CONF to this file's path before sourcing it; that is
# also what hermes_set_tag() rewrites. See the note on that function.
#
# Keeping the run flags in one function is deliberate: the two paths previously
# disagreed (the upgrade path dropped -p 8642/-p 9119), which silently took the
# dashboard and API server off localhost while the container still looked healthy.

# Site-specific values (network, subnet, gateway, DNS domain) live in site.conf
# next to this file. Resolved off HERMES_CONF rather than $0, because this file
# is *sourced*: $0 would be the sourcing script, not this one. Every caller
# guarantees HERMES_CONF -- verify.sh check 4 asserts it.
SITE_CONF="${${HERMES_CONF:?hermes-container.conf: HERMES_CONF must be set by the caller before sourcing this file}:h}/site.conf"
[ -r "$SITE_CONF" ] || {
  print -u2 -r -- "FATAL: cannot read $SITE_CONF (copy site.conf.example to site.conf)"
  return 1 2>/dev/null || exit 1
}
source "$SITE_CONF"

HERMES_IMAGE_REPO="nousresearch/hermes-agent"
# Rewritten by hermes-upgrade.sh on a successful upgrade (keep on its own line:
# the rewrite replaces this whole line).
HERMES_IMAGE_TAG="v2026.9.21"
HERMES_CONTAINER="hermes"
HERMES_NETWORK="$SITE_NETWORK"
CONTAINER_BIN="/usr/local/bin/container"

# Note on -e HERMES_DASHBOARD=1: the s6 dashboard service reads this through
# `with-contenv`, i.e. from the CONTAINER environment. Setting it in
# ~/.hermes/.env is not enough -- only the Python process reads that file, so
# s6 sees nothing, the run script exits 0 and the slot is marked permanently
# down. The basic-auth credentials stay in .env (the dashboard process does
# read it), so no secret is duplicated into this file or the process list.

# Create the container. $1 overrides the tag (used for rollback).
hermes_container_create() {
  local tag="${1:-$HERMES_IMAGE_TAG}"
  "$CONTAINER_BIN" run -d \
    --name "$HERMES_CONTAINER" \
    --network "$HERMES_NETWORK" \
    -v "$HOME/.hermes:/opt/data" \
    -p 8642:8642 \
    -p 9119:9119 \
    -e HERMES_DASHBOARD=1 \
    "${HERMES_IMAGE_REPO}:${tag}" gateway run
}

# Persist a new tag back into this file.
#
# The path comes from HERMES_CONF, which every caller sets to the file it is
# about to source. Hardcoding it here was a live footgun: this file moved into
# the repo while hermes_set_tag still pointed at the old location, so a
# successful nightly upgrade wrote the new tag to a file nothing reads, the
# repo copy kept the stale tag, and the next reboot recreated the container on
# it -- a silent downgrade. `--check` exits before this function, so no check
# short of a real upgrade would have caught it.
hermes_set_tag() {
  local newtag="$1"
  local conf="${HERMES_CONF:?hermes_set_tag: HERMES_CONF must be set by the caller before sourcing this file}"
  /usr/bin/sed -i '' "s|^HERMES_IMAGE_TAG=.*|HERMES_IMAGE_TAG=\"${newtag}\"|" "$conf"
}
